services:
  compiler:
    build:
      context: ./services/compiler
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TECTONIC_UNTRUSTED_MODE: "1"
      COMPILE_TIMEOUT_MS: "15000"
      MAX_SOURCE_BYTES: "524288"
      MAX_REQUEST_BYTES: "716800"
      MAX_PDF_BYTES: "10485760"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - compiler-cache:/cache
    networks:
      - compiler-internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped

networks:
  compiler-internal:
    internal: true

volumes:
  compiler-cache:
